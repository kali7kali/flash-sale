quarkus.application.name=checkout-service
quarkus.http.port=8080

# Redis (docker-compose). Dev Services desabilitado: usamos o Redis do docker-compose.
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:6379
quarkus.redis.devservices.enabled=false

# RabbitMQ (docker-compose)
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=5672
rabbitmq-username=guest
rabbitmq-password=guest
quarkus.rabbitmq.devservices.enabled=false

# Producer: fila order-created
mp.messaging.outgoing.order-created.connector=smallrye-rabbitmq
mp.messaging.outgoing.order-created.exchange.name=order-created
mp.messaging.outgoing.order-created.default-routing-key=order-created

# Consumer: fila order-compensation
mp.messaging.incoming.order-compensation.connector=smallrye-rabbitmq
mp.messaging.incoming.order-compensation.queue.name=order-compensation
mp.messaging.incoming.order-compensation.exchange.name=order-compensation
mp.messaging.incoming.order-compensation.routing-keys=order-compensation

# "Banco" de pedidos: order-processor-service
quarkus.rest-client.order-processor.url=${ORDER_PROCESSOR_URL:http://localhost:8081}

# Regras do projeto
checkout.cache.ttl-seconds=300
checkout.order-lookup.retry-delay-ms=300
checkout.seed.enabled=true
checkout.seed.product-id=PROD-001
checkout.seed.quantity=100

# Testes: canais em memória, sem Redis/RabbitMQ
%test.mp.messaging.outgoing.order-created.connector=smallrye-in-memory
%test.mp.messaging.incoming.order-compensation.connector=smallrye-in-memory
%test.checkout.seed.enabled=false
%test.checkout.order-lookup.retry-delay-ms=0
