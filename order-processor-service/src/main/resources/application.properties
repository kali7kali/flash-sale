quarkus.application.name=order-processor-service
quarkus.http.port=8081

# Banco próprio (segregado do checkout-service)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# RabbitMQ (docker-compose)
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=5672
rabbitmq-username=guest
rabbitmq-password=guest
quarkus.rabbitmq.devservices.enabled=false

# Consumer: fila order-created
mp.messaging.incoming.order-created.connector=smallrye-rabbitmq
mp.messaging.incoming.order-created.queue.name=order-created
mp.messaging.incoming.order-created.exchange.name=order-created
mp.messaging.incoming.order-created.routing-keys=order-created

# Producer: fila order-compensation
mp.messaging.outgoing.order-compensation.connector=smallrye-rabbitmq
mp.messaging.outgoing.order-compensation.exchange.name=order-compensation
mp.messaging.outgoing.order-compensation.default-routing-key=order-compensation

# Simulação de falhas
processor.failure-keyword=FALHA
processor.failure-rate=0

# Testes: canais em memória
%test.mp.messaging.incoming.order-created.connector=smallrye-in-memory
%test.mp.messaging.outgoing.order-compensation.connector=smallrye-in-memory
